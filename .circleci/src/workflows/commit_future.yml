# This allows you to easily deploy your branch to future.integreat.app to prototype changes or get feedback from non-techies
# Just replace the branch name in the equal check below with the name of your branch
when:
  equal: [4334-consolidate-theme, << pipeline.git.branch >>]
jobs:
  - bump_version:
      prepare_delivery: false
  - build_web:
      build_config_name: integreat-test-cms
      requires:
        - bump_version
  - deliver_web:
      delivery: future
      requires:
        - build_web
